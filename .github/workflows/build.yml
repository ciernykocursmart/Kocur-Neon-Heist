name: Test & Windows build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  test-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          ./godot --version

      - name: Import project
        run: ./godot --headless --editor --quit --path . || true

      - name: Run test-suite
        run: |
          ./godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee test.log
          test ${PIPESTATUS[0]} -eq 0
          if grep -q "SCRIPT ERROR" test.log; then echo "Runtime script errors found"; exit 1; fi

      - name: Install Windows export templates
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -q -j templates.tpz "templates/windows_release_x86_64.exe" "templates/windows_debug_x86_64.exe" "templates/version.txt" -d "$T"
          rm templates.tpz

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          ./godot --headless --path . --export-release "Windows Desktop" build/windows/KocurNeonHeist.exe
          test -f build/windows/KocurNeonHeist.exe

      - uses: actions/upload-artifact@v4
        with:
          name: KocurNeonHeist-windows-x86_64
          path: build/windows/KocurNeonHeist.exe
